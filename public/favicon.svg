<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="10" fill="#48205E"/>
  <!-- Outer octagram: two overlapping squares -->
  <polygon points="32,6 38,22 54,22 42,32 46,48 32,40 18,48 22,32 10,22 26,22"
    fill="none" stroke="#c4a47a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner rotated square -->
  <polygon points="32,12 44,32 32,52 20,32"
    fill="none" stroke="#c4a47a" stroke-width="1.5" opacity="0.7"/>
  <!-- Axis lines -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#c4a47a" stroke-width="1" opacity="0.4"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#c4a47a" stroke-width="1" opacity="0.4"/>
  <!-- Center glow dot -->
  <circle cx="32" cy="32" r="4" fill="#f5e6c8"/>
  <circle cx="32" cy="32" r="2" fill="white"/>
</svg>

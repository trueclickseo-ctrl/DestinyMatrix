<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="gold-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#E2C685"/>
      <stop offset="80%" stop-color="#C4A052"/>
      <stop offset="100%" stop-color="#9E7B3B"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Icon -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" fill="#1C0D26" stroke="url(#gold-logo)" stroke-width="2"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#gold-logo)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    
    <!-- Octagram Star -->
    <rect x="25" y="25" width="50" height="50" rx="3" fill="none" stroke="url(#gold-logo)" stroke-width="2.5" filter="url(#logo-glow)"/>
    <rect x="25" y="25" width="50" height="50" rx="3" fill="none" stroke="url(#gold-logo)" stroke-width="2.5" transform="rotate(45 50 50)" filter="url(#logo-glow)"/>
    
    <!-- Central Sparkle -->
    <path d="M50 32 L54 46 L68 50 L54 54 L50 68 L46 54 L32 50 L46 46 Z" fill="url(#gold-logo)"/>
    <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="125" y="68" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="42" font-weight="700" letter-spacing="4" fill="url(#gold-logo)" filter="url(#logo-glow)">
    SOULIOGRAPHY
  </text>
  
  <!-- Subtle Tagline under brand name -->
  <text x="128" y="94" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#E2C685" opacity="0.85">
    SOUL MATRIX &amp; NUMEROLOGY
  </text>
</svg>

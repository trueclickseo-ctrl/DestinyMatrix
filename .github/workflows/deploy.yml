name: Deploy Astro Site to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build

      - name: Deploy via LFTP Mirror
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
          set ftp:ssl-allow no;
          set net:max-retries 10;
          set net:timeout 30;
          set net:reconnect-interval-base 2;
          open -u 'u104700239.souliography.com','Z#3yuGwOP|&p6nDj' 195.35.39.151;
          mirror -R --parallel=3 --verbose ./dist/ ./
          "

      - name: Verify Deployed Files
        run: |
          echo "Verifying deployment:"
          curl -s -I https://souliography.com/en/

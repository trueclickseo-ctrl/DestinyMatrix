<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#231530" rx="96"/>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#C4A052"/>
      <stop offset="100%" stop-color="#9E7B3B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Outer Matrix Points -->
  <g fill="url(#gold)" opacity="0.8">
    <circle cx="256" cy="46" r="6"/>
    <circle cx="256" cy="466" r="6"/>
    <circle cx="46" cy="256" r="6"/>
    <circle cx="466" cy="256" r="6"/>
    <circle cx="107" cy="107" r="5"/>
    <circle cx="405" cy="107" r="5"/>
    <circle cx="107" cy="405" r="5"/>
    <circle cx="405" cy="405" r="5"/>
  </g>

  <!-- 8-Pointed Mystical Star / Octagram -->
  <g stroke="url(#gold)" stroke-width="5" fill="none" filter="url(#glow)">
    <!-- Square 1 -->
    <rect x="136" y="136" width="240" height="240" rx="8"/>
    <!-- Square 2 rotated 45 deg -->
    <rect x="136" y="136" width="240" height="240" rx="8" transform="rotate(45 256 256)"/>
  </g>

  <!-- Inner Flower of Life / Hexagram Core -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4 4" opacity="0.9"/>
  
  <!-- Central Sparkle Diamond -->
  <path d="M256 186 L272 240 L326 256 L272 272 L256 326 L240 272 L186 256 L240 240 Z" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
</svg>

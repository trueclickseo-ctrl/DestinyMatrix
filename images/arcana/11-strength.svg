<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1C1128"/>
          <stop offset="50%" stop-color="#2D1B3E"/>
          <stop offset="100%" stop-color="#130B1C"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F3E5AB"/>
          <stop offset="50%" stop-color="#C4A052"/>
          <stop offset="100%" stop-color="#9E7B3B"/>
        </linearGradient>
      </defs>
      
      <!-- Card Frame -->
      <rect x="8" y="8" width="284" height="384" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
      <rect x="18" y="18" width="264" height="364" rx="10" fill="none" stroke="#C4A052" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
      
      <!-- Inner Arch -->
      <path d="M 35 120 A 115 115 0 0 1 265 120 L 265 340 L 35 340 Z" fill="#231530" stroke="url(#goldGrad)" stroke-width="2"/>
      
      <!-- Celestial Stars -->
      <circle cx="60" cy="50" r="2" fill="#F3E5AB"/>
      <circle cx="240" cy="50" r="2" fill="#F3E5AB"/>
      <circle cx="150" cy="35" r="3" fill="#F3E5AB"/>
      
      <!-- Archetype Icon / Symbol -->
      <text x="150" y="210" text-anchor="middle" font-size="64" fill="#F3E5AB" font-family="serif">🦁</text>
      
      <!-- Title -->
      <text x="150" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="url(#goldGrad)" font-family="serif" letter-spacing="2">XI. STRENGTH</text>
      <text x="150" y="330" text-anchor="middle" font-size="10" fill="#C4A052" font-family="sans-serif" letter-spacing="3">DESTINY MATRIX</text>
    </svg>